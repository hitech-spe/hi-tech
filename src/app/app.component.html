@if (showSplash) {
  <div class="global-splash-screen" [class.fade-out]="fadeSplash">
    <div class="splash-content">
      <!-- 3D Isometric Network Cube (Procedural drawing in real time) -->
      <div class="cube-wrapper">
        <svg class="enterprise-cube-svg" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00d2ff" />
              <stop offset="100%" stop-color="#0066ff" />
            </linearGradient>
          </defs>
          
          <!-- Facce esterne del cubo tratteggiate e soffuse -->
          <polygon points="60,15 100,38 100,82 60,105 20,82 20,38" class="cube-polygon" />
          
          <!-- Spigoli del cubo che si disegnano a laser -->
          <line x1="60" y1="15" x2="60" y2="60" class="cube-edge line-1" />
          <line x1="100" y1="38" x2="60" y2="60" class="cube-edge line-2" />
          <line x1="20" y1="38" x2="60" y2="60" class="cube-edge line-3" />
          <line x1="60" y1="60" x2="60" y2="105" class="cube-edge line-4" />
          <line x1="100" y1="82" x2="60" y2="60" class="cube-edge line-5" />
          <line x1="20" y1="82" x2="60" y2="60" class="cube-edge line-6" />
          
          <line x1="60" y1="15" x2="100" y2="38" class="cube-edge outer-edge line-7" />
          <line x1="100" y1="38" x2="100" y2="82" class="cube-edge outer-edge line-8" />
          <line x1="100" y1="82" x2="60" y2="105" class="cube-edge outer-edge line-9" />
          <line x1="60" y1="105" x2="20" y2="82" class="cube-edge outer-edge line-10" />
          <line x1="20" y1="82" x2="20" y2="38" class="cube-edge outer-edge line-11" />
          <line x1="20" y1="38" x2="60" y2="15" class="cube-edge outer-edge line-12" />
          
          <!-- Nodi strutturali che compaiono al completamento del disegno -->
          <circle cx="60" cy="15" r="3.5" class="cube-node" />
          <circle cx="100" cy="38" r="3.5" class="cube-node" />
          <circle cx="100" cy="82" r="3.5" class="cube-node" />
          <circle cx="60" cy="105" r="3.5" class="cube-node" />
          <circle cx="20" cy="82" r="3.5" class="cube-node" />
          <circle cx="20" cy="38" r="3.5" class="cube-node" />
          <circle cx="60" cy="60" r="4.5" class="cube-node core-node" />
        </svg>
      </div>

      <!-- Logo aziendale con riflesso shimmer -->
      <div class="logo-shimmer-wrapper">
        <img src="/assets/images/logo-trasp.webp" alt="Hi-Tech Solutions Logo" priority fetchpriority="high"
             loading="eager" width="255" height="86" class="corporate-logo">
        <div class="shimmer-reflection"></div>
      </div>

      <!-- Sottile indicatore di caricamento (1px di spessore, stile Apple/Stripe) -->
      <div class="corporate-loader-container">
        <div class="loader-track">
          <div class="loader-bar"></div>
        </div>
      </div>
    </div>
  </div>
}

<app-header></app-header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>

<app-spinner></app-spinner>
